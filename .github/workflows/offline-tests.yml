name: Offline fixture tests

on:
  push:
    branches: [main, 'feature/**', 'fix/**', 'docs/**', 'preview/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fixture-tests:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        node: ['22.15.0', '24.17.0']
    steps:
      - name: Check out the proposed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false
          set-safe-directory: false
      - name: Set up the tested Node version
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
          check-latest: false
          token: ''
      - name: Run version and synthetic fixture tests
        run: node scripts/ci-offline.mjs

# Provisioning/checking out the runner can use the network. The tests use local
# synthetic roots and loopback only. No npm install, real sessions, user secrets,
# pull_request_target, write token, deployment, package publishing, cache upload,
# or artifact upload is configured. Browser tests are an optional local check.
